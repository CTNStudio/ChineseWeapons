// Shared convention: modern targets derive their data/resource pack from
// common/src/main/resources with scripts/generate-resources.py.
//
// Usage in a target build.gradle (after `shared.gradle`):
//   ext.resourceProfile = '26.1-neoforge'
//   apply from: file('../../gradle/target-conventions/generated-resources.gradle')
//
// The generated tree is placed first in the main resource source set so it wins
// over the 1.20.1 layout in common (processResources uses DuplicatesStrategy.EXCLUDE).
// Metadata (fabric.mod.json, mods.toml, neoforge.mods.toml, mixin configs, pack.mcmeta)
// stays hand-owned in the target source tree and is never generated.

def profileName = project.findProperty('resourceProfile') ?: project.ext.resourceProfile
if (!profileName) {
    throw new GradleException('generated-resources.gradle requires resourceProfile (project property or ext)')
}

def generatorPython = project.findProperty('resourceGeneratorPython') ?: 'python'
def generatorScript = file('../../scripts/generate-resources.py')
def profilesDirectory = file('../../scripts/resource-profiles')
def commonResources = file('../../common/src/main/resources')
def commonJava = file('../../common/src/main/java')
def generatedDir = layout.buildDirectory.dir("generated/resources/${profileName}")

if (!generatorScript.isFile()) {
    throw new GradleException("resource generator not found: ${generatorScript}")
}

def generateResources = tasks.register('generateResources', Exec) {
    description = "Derives the ${profileName} data/resource pack from common 1.20.1 resources"
    group = 'resources'
    inputs.file(generatorScript)
    inputs.dir(profilesDirectory)
    inputs.dir(commonResources)
    inputs.dir(commonJava)
    outputs.dir(generatedDir)
    commandLine generatorPython, generatorScript.absolutePath,
            '--profile', profileName,
            '--output', generatedDir.get().asFile.absolutePath
}

tasks.register('checkGeneratedResources', Exec) {
    description = "Compares the generated ${profileName} tree with scripts/resource-golden/${profileName}.json"
    group = 'verification'
    dependsOn generateResources
    commandLine generatorPython, generatorScript.absolutePath,
            '--profile', profileName,
            '--output', generatedDir.get().asFile.absolutePath,
            '--check-golden'
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn generateResources
}

tasks.matching { it.name == 'sourcesJar' }.configureEach {
    dependsOn generateResources
}

sourceSets.main.resources.srcDirs = [generatedDir.get().asFile] + sourceSets.main.resources.srcDirs
