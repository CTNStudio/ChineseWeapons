plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

apply from: file('../../gradle/target-conventions/shared.gradle')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets.main.resources.srcDir 'src/generated/resources'

commonJava {
    // Intentionally empty: no shared source file is excluded. Target-local procedures
    // are thin event adapters around the shared rules in common/.../rules.
}

legacyForge {
    version = "${forge_minecraft_version}-${forge_version}"
    validateAccessTransformers = true
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', file('../../common/src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "MinecraftForge"
        url = "https://maven.minecraftforge.net/"
        content {
            includeGroup "net.minecraftforge"
        }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Latvian"
        url = "https://maven.latvian.dev/releases"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }
}

dependencies {
    compileOnly "mezz.jei:jei-1.20.1-common-api:15.21.0.148"
    compileOnly "mezz.jei:jei-1.20.1-forge-api:15.21.0.148"
    runtimeOnly "mezz.jei:jei-1.20.1-forge:15.21.0.148"

    compileOnly "dev.latvian.mods:kubejs-forge:2001.6.5-build.26"
    runtimeOnly "dev.latvian.mods:kubejs-forge:2001.6.5-build.26"
    runtimeOnly "dev.latvian.mods:rhino-forge:2001.2.3-build.10"
    runtimeOnly "dev.architectury:architectury-forge:9.2.14"

    compileOnly "maven.modrinth:emi:1.1.24+1.20.1+forge"

    compileOnly "vazkii.patchouli:Patchouli:1.20.1-84-FORGE"
    runtimeOnly "vazkii.patchouli:Patchouli:1.20.1-84-FORGE"

    compileOnly "org.jetbrains:annotations:24.0.1"
    compileOnly "com.mojang:brigadier:1.1.8"
    compileOnly "com.mojang:datafixerupper:6.0.8"
    compileOnly "it.unimi.dsi:fastutil:8.5.9"
    compileOnly "org.joml:joml:1.10.5"
    compileOnly "io.netty:netty-buffer:4.1.82.Final"
    compileOnly "io.netty:netty-common:4.1.82.Final"
    compileOnly "org.lwjgl:lwjgl:3.3.1"
    compileOnly "org.lwjgl:lwjgl-glfw:3.3.1"
    compileOnly "org.lwjgl:lwjgl-opengl:3.3.1"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : forge_minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : forge_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test', Test).configure {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport', JacocoReport).configure {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

apply from: file('../../gradle/target-conventions/hot-debug.gradle')
apply from: file('../../gradle/target-conventions/publish.gradle')
