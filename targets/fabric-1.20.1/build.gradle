buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.10.5'
        classpath 'me.modmuss50:mod-publish-plugin:2.1.1'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'
apply plugin: 'me.modmuss50.mod-publish-plugin'

apply from: file('../../gradle/target-conventions/shared.gradle')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

loom {
    mixin {
        defaultRefmapName = 'chineseweapons-fabric.refmap.json'
    }
}

commonJava {
    // Intentionally empty: no shared source file is excluded. Target-local procedures
    // are thin event adapters around the shared rules in common/.../rules.
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Forge provided JSR-305 annotations implicitly; vanilla 1.20.1 does not, and
    // the shared sources use javax.annotation.Nullable in their method signatures.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // Optional KubeJS API surface (compat.kubejs); the mod is not required at runtime.
    def kubejsCoordinate = providers.gradleProperty('debug_kubejs').orNull
    if (kubejsCoordinate != null && !kubejsCoordinate.trim().isEmpty()) {
        modCompileOnly kubejsCoordinate
    }

    // Optional JEI API surface (jei/); compile-only, JEI is not a runtime dependency.
    modCompileOnly 'maven.modrinth:jei:15.20.0.104'

    // Optional EMI API surface (compat/emi/); compile-only, EMI is not a runtime dependency.
    modCompileOnly 'maven.modrinth:emi:1.1.24+1.20.1+fabric'
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Forge's conditional recipe wrapper is not understood by Fabric and its
    // result is a Patchouli guide book; the Patchouli integration is not ported.
    exclude 'data/chineseweapons/recipes/forging_notes.json'
    def replaceProperties = [
            minecraft_version    : fabric_minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

apply from: file('../../gradle/target-conventions/hot-debug.gradle')
apply from: file('../../gradle/target-conventions/publish.gradle')
