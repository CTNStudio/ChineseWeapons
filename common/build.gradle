// Standalone build for the shared source tree.
//
// common/ holds every piece of code that has no confirmed loader/version
// difference. It MAY reference Minecraft and loader types: the split rule is
// "a confirmed version difference", not "platform independence". It compiles
// against the same legacyforge classpath as targets/forge-1.20.1, so it can be
// built and tested on its own:
//
//     gradlew -p common build
//
// Targets compile the original files directly in their own source set.
// Their commonJava blocks exclude files with confirmed version differences;
// this standalone build is not imported by a target.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

def properties = new Properties()
file('../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    version = "${forge_minecraft_version}-${forge_version}"
}

// The shared tree now contains only definitions, SPI and version-neutral
// logic; concrete content implementations live in the targets. This standalone
// build compiles the shared tree together with the reference Forge 1.20.1
// target so `gradlew -p common build` remains a meaningful compile check.
sourceSets {
    main {
        java {
            srcDir '../targets/forge-1.20.1/src/main/java'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.minecraftforge.net/'
        content {
            includeGroup 'net.minecraftforge'
            includeGroup 'de.oceanlabs.mcp'
        }
    }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.latvian.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Compile-time libraries that the legacyforge classpath no longer supplies
    // here because the standalone build does not resolve the NeoForged
    // minecraft-dependencies platform.
    compileOnly "org.jetbrains:annotations:24.0.1"
    compileOnly "mezz.jei:jei-1.20.1-common-api:15.21.0.148"
    compileOnly "mezz.jei:jei-1.20.1-forge-api:15.21.0.148"
    compileOnly "dev.latvian.mods:kubejs-forge:2001.6.5-build.26"
    compileOnly "maven.modrinth:emi:1.1.24+1.20.1+forge"
    compileOnly "vazkii.patchouli:Patchouli:1.20.1-84-FORGE"
    // Minecraft runtime libraries normally supplied through the NeoForged
    // minecraft-dependencies platform. Declared explicitly so the standalone
    // common build does not depend on that platform resolution.
    compileOnly "com.mojang:brigadier:1.1.8"
    compileOnly "com.mojang:datafixerupper:6.0.8"
    compileOnly "it.unimi.dsi:fastutil:8.5.9"
    compileOnly "org.joml:joml:1.10.5"
    compileOnly "io.netty:netty-buffer:4.1.82.Final"
    compileOnly "io.netty:netty-common:4.1.82.Final"
    compileOnly "org.lwjgl:lwjgl:3.3.1"
    compileOnly "org.lwjgl:lwjgl-glfw:3.3.1"
    compileOnly "org.lwjgl:lwjgl-opengl:3.3.1"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
